name: CI - Secret Scan

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read   # gitleaks-action lists PR commits

jobs:
  gitleaks:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0          # scan every commit, not just the tip
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
