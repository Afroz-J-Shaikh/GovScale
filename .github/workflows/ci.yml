name: CI and DevSecOps

on:
  push:
    branches: [main, "devsecops/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python validation and dependency security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt bandit pip-audit

      - name: Compile Python files
        run: |
          python -m py_compile app.py process_notifications.py seed_institutions.py

      - name: Static application security testing (Bandit)
        run: bandit -r app.py process_notifications.py seed_institutions.py -ll

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history and files with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-build:
    name: Build and scan container
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build container image
        run: docker build --pull --tag govscale:ci .

      - name: Scan image for OS and library vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: govscale:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan repository configuration and dependencies
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
