name: GovScale CI - DevSecOps Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".env.example"
      - ".github/dependabot.yml"
      - "infra/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".env.example"
      - ".github/dependabot.yml"
      - "infra/**"
  workflow_dispatch:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read
  pull-requests: read

jobs:
  # ---- Quality & security gates (run in parallel) ----
  lint-test:
    uses: ./.github/workflows/lint-test.yml

  secret-scan:
    uses: ./.github/workflows/secrets-scan.yml

  sast:
    uses: ./.github/workflows/sast.yml

  dependency-scan:
    uses: ./.github/workflows/dependency-scan.yml

  dockerfile-lint:
    uses: ./.github/workflows/dockerfile-lint.yml

  # ---- Build once every gate has passed ----
  build-scan:
    needs: [lint-test, secret-scan, sast, dependency-scan, dockerfile-lint]
    uses: ./.github/workflows/docker-build-scan.yml
    with:
      # Keep the image only when it may be pushed to ECR
      upload-image: ${{ vars.ENABLE_ECR_PUSH == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

  # ---- Optional: push to ECR (enable with repo variable ENABLE_ECR_PUSH=true) ----
  ecr-push:
    if: ${{ vars.ENABLE_ECR_PUSH == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: build-scan
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/ecr-push.yml
    secrets: inherit

  # ---- Does the Beanstalk environment exist yet? (Terraform must have applied first) ----
  # Set ENABLE_EB_DEPLOY=TRUE
  check-infra: 
    needs: ecr-push
    if: ${{ vars.ENABLE_ECR_PUSH == 'true' && vars.ENABLE_EB_DEPLOY == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - id: check
        env:
          EB_ENV: ${{ vars.EB_ENVIRONMENT_NAME || 'govscale-prod' }}
        run: |
          STATUS=$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENV" \
            --query "Environments[?Status!='Terminated'] | [0].Status" --output text)
          if [ -z "$STATUS" ] || [ "$STATUS" = "None" ]; then
            echo "::warning::Environment $EB_ENV does not exist. Run 'Infra - Terraform' first. Skipping deploy."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Environment status: $STATUS"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

  # ---- Optional: deploy to Elastic Beanstalk ----
  deploy:
    if: ${{ needs.check-infra.outputs.exists == 'true' }}
    needs: [ecr-push, check-infra]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-eb.yml
    secrets: inherit 