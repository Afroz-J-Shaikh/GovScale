# Shared build settings, reused by all three services (same image)
x-build: &build
  context: .

# Shared environment. Values come from .env; `:?` stops with an error if missing.
x-env: &env
  GOVSCALE_SECRET_KEY: ${GOVSCALE_SECRET_KEY:?Set GOVSCALE_SECRET_KEY in .env}
  GOVSCALE_ADMIN_EMAIL: ${GOVSCALE_ADMIN_EMAIL:-admin@gmail.com}
  GOVSCALE_ADMIN_PASSWORD: ${GOVSCALE_ADMIN_PASSWORD:?Set GOVSCALE_ADMIN_PASSWORD in .env}

# Shared container hardening: drop all Linux capabilities and block
# privilege escalation inside the container (no side effects for this app).
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  # Default initialization: institutions + admin. Idempotent, runs on every up.
  init:
    <<: *hardening
    build: *build
    image: govscale:local
    command: ["sh", "-c", "python scripts/seed_institutions.py && python scripts/create_admin.py"]
    environment: *env
    volumes:
      - govscale_data:/app/instance
    restart: "no"          # one-shot job: run once, then exit

  app:
    <<: *hardening
    build: *build
    image: govscale:local
    # Start only after init has finished successfully (database is ready)
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      # host port : container port (host side configurable in .env)
      # Local-only access? Use "127.0.0.1:${GOVSCALE_HOST_PORT:-5000}:5000" instead.
      - "${GOVSCALE_HOST_PORT:-5000}:5000"
    environment: *env
    volumes:
      - govscale_data:/app/instance
    # Resource limits so a runaway process can't starve the host
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 256
    restart: unless-stopped
    # Marks the container healthy once /health answers
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s    # grace period while the app boots

  # Optional demo data. Never started by a plain `docker compose up`.
  # Run it with: docker compose run --rm demo-seed
  demo-seed:
    <<: *hardening
    build: *build
    image: govscale:local
    profiles: ["demo"]
    command: ["python", "scripts/import_demo_data.py"]
    environment:
      <<: *env
      GOVSCALE_DEMO_PASSWORD: ${GOVSCALE_DEMO_PASSWORD:-}   # empty = random password
    volumes:
      - govscale_data:/app/instance
    restart: "no"

# Named volume: keeps the SQLite database across rebuilds and `down`
# (only `down -v` deletes it)
volumes:
  govscale_data:
